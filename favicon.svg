<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#4facfe"/>
    </linearGradient>
    <linearGradient id="neonGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f5d4"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Circle -->
  <circle cx="256" cy="256" r="240" fill="url(#bgGrad)" stroke="#00f2fe" stroke-width="12" filter="url(#glow)"/>

  <!-- Candlesticks & Trading Chart Path -->
  <g filter="url(#glow)">
    <!-- Candle 1 -->
    <line x1="140" y1="140" x2="140" y2="360" stroke="#ff0055" stroke-width="6"/>
    <rect x="128" y="200" width="24" height="100" fill="#ff0055" rx="4"/>

    <!-- Candle 2 (Green) -->
    <line x1="220" y1="120" x2="220" y2="380" stroke="#00f5d4" stroke-width="6"/>
    <rect x="208" y="160" width="24" height="160" fill="#00f5d4" rx="4"/>

    <!-- Lightning Bolt / Fast Execution Icon -->
    <path d="M340 100 L240 270 L310 270 L220 420 L380 230 L310 230 Z" fill="url(#neonCyan)" stroke="#ffffff" stroke-width="4"/>
  </g>
</svg>
